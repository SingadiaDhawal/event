<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Your Photos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  font-family: 'Inter', sans-serif;
  background: #0f172a;
  color: #f8fafc;
}
.page { width: 100%; max-width: 1100px; margin: 0 auto; padding: 30px 16px 60px; }
.hero { text-align: center; padding: 20px 10px 30px; }
.logo {
  width: 72px; height: 72px; margin: 0 auto 16px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 22px; background: linear-gradient(135deg, #6366f1, #a855f7);
  color: white; font-size: 32px; box-shadow: 0 10px 30px rgba(99,102,241,0.4);
}
h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 44px); letter-spacing: -1px; font-weight: 800; }
.subtitle { margin: 0; color: #94a3b8; font-size: 16px; line-height: 1.5; }

.card {
  background: #1e293b; border: 1px solid #334155; border-radius: 24px;
  padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); margin-top: 24px;
}

.input-group { margin-bottom: 20px; }
.input-group label { display: block; font-size: 13px; font-weight: 700; color: #cbd5e1; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
.input-group input[type="text"] {
  width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid #475569;
  background: #0f172a; color: white; font-size: 15px; font-family: inherit;
}
.input-group input[type="text"]:focus { outline: 2px solid #6366f1; border-color: transparent; }

.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
.tab {
  border: 0; border-radius: 14px; padding: 14px; background: #0f172a;
  color: #94a3b8; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s;
}
.tab.active { background: #6366f1; color: white; box-shadow: 0 4px 15px rgba(99,102,241,0.3); }
.tab-content { display: none; }
.tab-content.active { display: block; }

.mode-selector { margin-bottom: 16px; display: flex; gap: 20px; font-size: 14px; font-weight: 600; color: #cbd5e1; }
.mode-selector label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

.upload-box {
  border: 2px dashed #475569; border-radius: 18px; padding: 40px 20px;
  text-align: center; cursor: pointer; transition: 0.2s; display: block; background: #0f172a;
}
.upload-box:hover { border-color: #6366f1; background: #111827; }
#file-input { display: none !important; }

.preview-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; justify-content: center; }
.preview-item { position: relative; width: 90px; height: 90px; border-radius: 12px; overflow: hidden; border: 2px solid #475569; }
.preview-item img { width: 100%; height: 100%; object-fit: cover; }
.preview-item button {
  position: absolute; bottom: 0; width: 100%; background: rgba(220, 38, 38, 0.85);
  color: white; font-size: 10px; padding: 4px; border: 0; cursor: pointer; font-weight: 700;
}

video { width: 100%; max-width: 500px; border-radius: 16px; background: #000; display: block; margin: 0 auto; }
.camera-overlay { font-size: 16px; font-weight: 800; color: #818cf8; margin-bottom: 12px; background: rgba(99,102,241,0.1); padding: 8px; border-radius: 8px; display: inline-block; }

button { border: 0; cursor: pointer; border-radius: 14px; padding: 14px 20px; font-size: 15px; font-weight: 800; transition: 0.2s; }
.primary { width: 100%; margin-top: 24px; background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; box-shadow: 0 4px 20px rgba(99,102,241,0.4); }
.primary:hover { opacity: 0.95; transform: translateY(-1px); }
.secondary { background: #334155; color: #f8fafc; }
.secondary:hover { background: #475569; }
button:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

.status { display: none; margin-top: 24px; padding: 30px; border-radius: 20px; background: #1e293b; text-align: center; border: 1px solid #334155; }
.spinner { width: 40px; height: 40px; border: 4px solid #334155; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.progress { height: 8px; background: #0f172a; border-radius: 20px; overflow: hidden; margin-top: 16px; }
.progress-bar { height: 100%; width: 0%; background: #6366f1; transition: width 0.3s; }

.error { display: none; margin-top: 20px; padding: 16px; border-radius: 14px; background: #7f1d1d; color: #fca5a5; font-weight: 600; font-size: 14px; }

.results { display: none; margin-top: 30px; }
.user-banner {
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  background: #1e293b; border: 1px solid #334155; padding: 20px 24px; border-radius: 20px; margin-bottom: 24px; flex-wrap: wrap;
}
.user-profile { display: flex; align-items: center; gap: 16px; }
.avatar { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #6366f1, #a855f7); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; color: white; }
.user-meta h2 { margin: 0 0 4px; font-size: 20px; font-weight: 800; }
.user-meta p { margin: 0; color: #94a3b8; font-size: 14px; }
.stats-badge { background: #0f172a; padding: 10px 16px; border-radius: 12px; border: 1px solid #334155; font-size: 13px; font-weight: 700; color: #818cf8; }

.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
.photo-card { overflow: hidden; border-radius: 18px; background: #1e293b; border: 1px solid #334155; transition: 0.2s; }
.photo-card:hover { transform: translateY(-3px); border-color: #6366f1; }
.photo-card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; cursor: pointer; }
.photo-info { padding: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.download { padding: 8px 12px; border-radius: 10px; background: #6366f1; color: white; text-decoration: none; font-size: 12px; font-weight: 700; white-space: nowrap; }

/* Lightbox Modal */
.modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; padding: 20px; }
.modal img { max-width: 90%; max-height: 85vh; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
.modal-close { position: absolute; top: 25px; right: 30px; color: white; font-size: 36px; font-weight: 800; cursor: pointer; }

.gallery-source { margin-top: 24px; padding-top: 20px; border-top: 1px solid #334155; }
.gallery-source-label { font-size: 13px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.05em; }
.custom-gallery-input { margin-top: 12px; }
.custom-gallery-input input[type="url"] {
  width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 14px;
}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="page">

  <section class="hero">
    <div class="logo">📸</div>
    <h1>Find Your Photos</h1>
    <p class="subtitle">Upload or scan your face angles to instantly retrieve your event memories.</p>
  </section>

  <div class="card" id="input-card">
    <div class="input-group">
      <label for="user-name">Your Name (Optional)</label>
      <input type="text" id="user-name" placeholder="Enter your name (e.g. Alex)">
    </div>

    <div class="tabs">
      <button class="tab active" id="upload-tab" onclick="switchTab('upload')">📤 Upload Photos</button>
      <button class="tab" id="camera-tab" onclick="switchTab('camera')">📷 Guided Camera Scan</button>
    </div>

    <!-- Upload Content -->
    <div class="tab-content active" id="upload-content">
      <div class="mode-selector">
        <label><input type="radio" name="upload-mode" value="single" checked onchange="toggleUploadMode()"> Single Image</label>
        <label><input type="radio" name="upload-mode" value="multiple" onchange="toggleUploadMode()"> Multiple Images (Angles)</label>
      </div>
      <label class="upload-box" for="file-input">
        <div style="font-size: 40px; margin-bottom: 10px;">🖼️</div>
        <div id="upload-label-text" style="font-size: 16px; font-weight: 800;">Choose photo(s)</div>
        <div style="font-size: 13px; color: #94a3b8; margin-top: 4px;">Click to browse device storage</div>
      </label>
      <input id="file-input" type="file" accept="image/*">
      <div class="preview-grid" id="upload-preview"></div>
    </div>

    <!-- Camera Content -->
    <div class="tab-content" id="camera-content">
      <div class="mode-selector">
        <label><input type="radio" name="cam-mode" value="single" checked onchange="toggleCamMode()"> Single Snapshot</label>
        <label><input type="radio" name="cam-mode" value="multiple" onchange="toggleCamMode()"> Multi-Angle Sequence</label>
      </div>
      <div style="text-align: center;">
        <div class="camera-overlay" id="camera-instruction" style="display:none;">Look Straight Ahead</div>
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none"></canvas>
        <div style="margin-top: 12px;">
          <button class="secondary" type="button" onclick="toggleCameraFacing()">Switch Camera (Front/Back)</button>
        </div>
        <div class="preview-grid" id="cam-preview" style="margin-top: 15px;"></div>
        <div class="camera-buttons" style="margin-top: 15px;">
          <button class="secondary" type="button" onclick="startCamera()">Restart Camera</button>
          <button class="primary" id="capture-btn" type="button" onclick="handleCaptureAction()" style="margin-top:0;">Capture Photo</button>
        </div>
      </div>
    </div>

    <div class="gallery-source">
      <div class="gallery-source-label">Photos source</div>
      <div class="gallery-options">
        <label class="gallery-option">
          <input type="radio" name="gallery-source" value="default" checked onchange="updateGallerySource()">
          Use this event's default gallery
        </label>
        <label class="gallery-option">
          <input type="radio" name="gallery-source" value="custom" onchange="updateGallerySource()">
          Search custom Google Drive folder
        </label>
      </div>
      <div class="custom-gallery-input" id="custom-gallery-input" style="display:none;">
        <input type="url" id="gallery-url-input" placeholder="https://drive.google.com/drive/folders/...">
      </div>
    </div>

    <button class="primary" id="find-button" onclick="startSearch()" disabled>Find My Photos</button>
  </div>

  <div class="card status" id="status">
    <div class="spinner"></div>
    <div id="status-text" style="font-weight: 800; margin-bottom: 4px;">Processing your scans...</div>
    <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
  </div>

  <div class="error" id="error"></div>

  <div class="results" id="results">
    <div class="user-banner" id="user-banner">
      <div class="user-profile">
        <div class="avatar" id="user-avatar">A</div>
        <div class="user-meta">
          <h2 id="greeting-title">Hello, Alex!</h2>
          <p>Here are your personalized event matches</p>
        </div>
      </div>
      <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        <div class="stats-badge" id="stats-badge">0 Matches Found</div>
        <button class="secondary" type="button" onclick="downloadAllPhotos()" style="padding: 10px 14px; font-size: 13px;">📥 Download All</button>
        <button class="secondary" type="button" onclick="startAgain()" style="padding: 10px 14px; font-size: 13px;">Search Again</button>
      </div>
    </div>
    <div class="gallery" id="gallery"></div>
  </div>

</div>

<!-- Lightbox Modal -->
<div class="modal" id="lightbox-modal">
  <span class="modal-close" onclick="closeLightbox()">&times;</span>
  <img id="lightbox-img" alt="Enlarged view">
</div>

<script src="app.js"></script>
</body>
</html>
