<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Your Photos</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 50%, #ffffff 100%);
  color: #172033;
}

.page { width: 100%; max-width: 1080px; margin: 0 auto; padding: 24px 18px 60px; }

.hero { text-align: center; padding: 35px 10px 25px; }

.logo {
  width: 68px; height: 68px; margin: 0 auto 18px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 20px;
  background: linear-gradient(135deg, #111827, #4f46e5);
  color: white; font-size: 30px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.12);
}

h1 { margin: 0 0 10px; font-size: clamp(30px, 6vw, 52px); letter-spacing: -1.5px; }
.subtitle { margin: 0; color: #667085; font-size: 17px; line-height: 1.6; }

.card {
  background: white; border: 1px solid #e5e7eb; border-radius: 24px;
  padding: 25px; box-shadow: 0 20px 60px rgba(15,23,42,0.08); margin-top: 20px;
}

.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }

.tab {
  border: 0; border-radius: 14px; padding: 14px; background: #f1f5f9;
  color: #475569; font-size: 15px; font-weight: 700; cursor: pointer;
}
.tab.active { background: #111827; color: white; }

.tab-content { display: none; }
.tab-content.active { display: block; }

.upload-box {
  border: 2px dashed #cbd5e1; border-radius: 20px; padding: 35px 20px;
  text-align: center; cursor: pointer; transition: 0.2s; display: block;
}
.upload-box:hover { border-color: #6366f1; background: #f8fafc; }
.upload-icon { font-size: 42px; margin-bottom: 12px; }
.upload-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
.upload-description { color: #64748b; font-size: 14px; }

input[type="file"] { display: none; }

.preview { display: none; margin-top: 20px; text-align: center; }
.preview img { max-width: 100%; max-height: 330px; border-radius: 18px; box-shadow: 0 10px 35px rgba(0,0,0,0.12); }

.camera { display: none; text-align: center; }
video { width: 100%; max-width: 600px; border-radius: 20px; background: #111827; }
.camera-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 15px; flex-wrap: wrap; }

button { border: 0; cursor: pointer; border-radius: 14px; padding: 13px 18px; font-size: 15px; font-weight: 800; }
.primary { width: 100%; margin-top: 20px; background: #111827; color: white; }
.secondary { background: #e2e8f0; color: #334155; }
button:disabled { opacity: 0.5; cursor: not-allowed; }

.status { display: none; margin-top: 20px; padding: 18px; border-radius: 16px; background: #f1f5f9; text-align: center; }
.spinner {
  width: 34px; height: 34px; border: 4px solid #cbd5e1; border-top-color: #111827;
  border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.progress { height: 9px; background: #e2e8f0; border-radius: 20px; overflow: hidden; margin-top: 12px; }
.progress-bar { height: 100%; width: 0%; background: #111827; transition: width 0.3s; }

.error { display: none; margin-top: 20px; padding: 16px; border-radius: 15px; background: #fef2f2; color: #b91c1c; }

.results { display: none; margin-top: 25px; }
.results-header { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 18px; flex-wrap: wrap; }
.results-title { font-size: 24px; font-weight: 900; }
.results-count { color: #64748b; font-size: 14px; }

.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.photo-card { overflow: hidden; border-radius: 18px; background: white; border: 1px solid #e5e7eb; box-shadow: 0 8px 25px rgba(15,23,42,0.06); }
.photo-card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
.photo-info { padding: 13px; }
.photo-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; color: #475569; margin-bottom: 10px; }
.download {
  display: block; text-align: center; padding: 10px; border-radius: 10px;
  background: #111827; color: white; text-decoration: none; font-size: 13px; font-weight: 700;
}

.empty { padding: 40px 20px; text-align: center; color: #64748b; }

.gallery-source { margin-top: 22px; padding-top: 20px; border-top: 1px solid #e5e7eb; }
.gallery-source-label { font-size: 13px; font-weight: 800; color: #475569; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px; }
.gallery-options { display: flex; flex-direction: column; gap: 8px; }
.gallery-option { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #334155; cursor: pointer; }
.gallery-option input[type="radio"] { accent-color: #111827; width: 16px; height: 16px; }
.custom-gallery-input { margin-top: 12px; }
.custom-gallery-input input[type="url"] {
  width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #cbd5e1;
  font-size: 14px; font-family: inherit;
}
.custom-gallery-input input[type="url"]:focus { outline: 2px solid #6366f1; border-color: transparent; }
.gallery-hint { margin-top: 8px; font-size: 12px; color: #94a3b8; line-height: 1.5; }

@media (max-width: 600px) {
  .page { padding: 12px 12px 40px; }
  .card { padding: 18px; border-radius: 20px; }
  .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="page">

  <section class="hero">
    <div class="logo">📸</div>
    <h1>Find Your Photos</h1>
    <p class="subtitle">Upload a selfie and we'll find your photos from the event.</p>
  </section>

  <div class="card" id="input-card">

    <div class="tabs">
      <button class="tab active" id="upload-tab" onclick="switchTab('upload')">📤 Upload Photo</button>
      <button class="tab" id="camera-tab" onclick="switchTab('camera')">📷 Take Selfie</button>
    </div>

    <div class="tab-content active" id="upload-content">
      <label class="upload-box" for="file-input">
        <div class="upload-icon">🖼️</div>
        <div class="upload-title">Choose your photo</div>
        <div class="upload-description">Use a clear photo showing your face</div>
      </label>
      <input id="file-input" type="file" accept="image/*">
      <div class="preview" id="upload-preview">
        <img id="preview-image" alt="Preview">
      </div>
    </div>

    <div class="tab-content" id="camera-content">
      <div class="camera" id="camera-box">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none"></canvas>
        <div class="camera-buttons">
          <button class="secondary" type="button" onclick="startCamera()">Start Camera</button>
          <button class="secondary" type="button" onclick="capturePhoto()">Capture</button>
        </div>
      </div>
    </div>

    <div class="gallery-source">
      <div class="gallery-source-label">Photos to search</div>
      <div class="gallery-options">
        <label class="gallery-option">
          <input type="radio" name="gallery-source" value="default" checked onchange="updateGallerySource()">
          Use this event's gallery
        </label>
        <label class="gallery-option">
          <input type="radio" name="gallery-source" value="custom" onchange="updateGallerySource()">
          Search my own Google Drive folder instead
        </label>
      </div>
      <div class="custom-gallery-input" id="custom-gallery-input" style="display:none;">
        <input type="url" id="gallery-url-input" placeholder="https://drive.google.com/drive/folders/...">
        <div class="gallery-hint">
          The folder must be shared as "Anyone with the link → Viewer".
          First-time searches on a new folder take longer since photos are scanned fresh.
        </div>
      </div>
    </div>

    <button class="primary" id="find-button" onclick="startSearch()" disabled>Find My Photos</button>

    <div class="status" id="status">
      <div class="spinner"></div>
      <div id="status-text">Searching...</div>
      <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
    </div>

    <div class="error" id="error"></div>
  </div>

  <div class="results" id="results">
    <div class="results-header">
      <div>
        <div class="results-title">Your Photos</div>
        <div class="results-count" id="results-count"></div>
      </div>
      <button class="secondary" type="button" onclick="startAgain()">Search Again</button>
    </div>
    <div class="gallery" id="gallery"></div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
